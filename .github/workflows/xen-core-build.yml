name: Xen-Kernel KSUN + SuSFS + Xen Core

on:
  workflow_dispatch:
  push:
    branches:
      - 16-KSUN_SuSFS

permissions:
  contents: read

concurrency:
  group: xen-ksun-susfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Lvyana
      KBUILD_BUILD_HOST: Xen-Kernel
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: "%compiler% --version"

    steps:
      - name: Checkout Xen-Kernel
        uses: actions/checkout@v4
        with:
          ref: 16-KSUN_SuSFS
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git curl libelf-dev libssl-dev make \
            python3 rsync device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libncurses-dev lz4 zip wget xz-utils file

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-xen-ksun-susfs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-xen-ksun-susfs-

      - name: Prepare Clang r547379 / 20
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/clang/bin/clang" ] || [ ! -x "$HOME/clang/bin/ld.lld" ]; then
            rm -rf "$HOME/clang"
            git clone --depth=1 --single-branch --branch 15.0 \
              https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
              "$HOME/clang"
            rm -rf "$HOME/clang/.git"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/ld.lld" --version

      - name: Strip -openela from kernel version (runner-only)
        shell: bash
        run: |
          set -euo pipefail

          echo "===== EXTRAVERSION before ====="
          grep -n '^EXTRAVERSION' Makefile

          # Match the established process in 16-KSUN_Manual_hook.
          # This edits only the temporary GitHub Actions checkout, not the repository commit.
          sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION =/' Makefile

          echo "===== EXTRAVERSION after ====="
          grep -n '^EXTRAVERSION' Makefile

          KERNEL_VERSION="$(make kernelversion)"
          echo "Kernel version after stripping vendor suffix: $KERNEL_VERSION"
          if printf '%s' "$KERNEL_VERSION" | grep -qi 'openela'; then
            echo "::error::-openela is still present in kernelversion."
            exit 1
          fi
          test "$KERNEL_VERSION" = "4.14.357" || {
            echo "::error::Unexpected base kernel version: $KERNEL_VERSION"
            exit 1
          }

      - name: Verify embedded SuSFS v2.3.0 integration
        shell: bash
        run: |
          set -euo pipefail
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          grep -q '^#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -q '^#define KSTAT_SPOOF_CTIME_TV_SEC (1 << 8)' include/linux/susfs.h
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -q '^CONFIG_KSU=y$' arch/arm64/configs/vayu_defconfig
          grep -q '^CONFIG_KSU_SUSFS=y$' arch/arm64/configs/vayu_defconfig
          grep -q 'SUSFS_IS_INODE_OPEN_REDIRECT' fs/open.c
          test -s fs/proc/xen_core.c
          grep -q 'proc-y.*xen_core.o' fs/proc/Makefile
          grep -q 'proc_create("xen_core", 0444' fs/proc/xen_core.c
          grep -Eq '^#define XEN_CORE_KEY[[:space:]]+"X3691QTZ"$' fs/proc/xen_core.c
          grep -Eq '^#define XEN_CORE_FAMILY[[:space:]]+"Xen-Kernel"$' fs/proc/xen_core.c
          grep -Eq '^#define XEN_CORE_VERSION[[:space:]]+"KSUN[+]4"$' fs/proc/xen_core.c
          grep -Eq '^#define XEN_CORE_DEVICE[[:space:]]+"vayu"$' fs/proc/xen_core.c
          grep -Eq '^#define XEN_CORE_FEATURE_LEVEL[[:space:]]+"L1"$' fs/proc/xen_core.c
          grep -q 'seq_printf(m, "CORE_KEY=%s' fs/proc/xen_core.c
          grep -q 'seq_printf(m, "FAMILY=%s' fs/proc/xen_core.c
          grep -q 'susfs_is_current_ksu_domain' fs/susfs.c
          grep -Fq 'int path_umount(struct path *path, int flags)' fs/namespace.c
          git diff --check

      - name: Install pinned KernelSU-Next and apply SuSFS compatibility bridge
        shell: bash
        env:
          KSUN_REPO: https://github.com/Lvyana-ren/KernelSU-Next
          KSUN_SHA: 465490a26667ba4cf00b3be975a7e28e53978829
        run: |
          set -euo pipefail
          test ! -e KernelSU-Next
          git clone "$KSUN_REPO" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSUN_SHA"
          ACTUAL="$(git -C KernelSU-Next rev-parse HEAD)"
          test "$ACTUAL" = "$KSUN_SHA" || {
            echo "::error::KSUN SHA mismatch: $ACTUAL"
            exit 1
          }

          python3 scripts/apply-ksun-susfs-compat.py KernelSU-Next
          git -C KernelSU-Next diff --check
          grep -q 'config KSU_SUSFS' KernelSU-Next/kernel/Kconfig
          grep -q 'SUSFS_MAGIC' KernelSU-Next/kernel/supercall/supercall.c
          grep -q 'XEN-SUSFS-KSUN-COMPAT: setuid runtime' KernelSU-Next/kernel/hook/setuid_hook.c

          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          grep -q 'KSU_MANUAL_HOOK' KernelSU-Next/kernel/Kconfig
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          echo "KSUN commit: $ACTUAL"
          git -C KernelSU-Next log -1 --oneline

      - name: Backport path_umount only if absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'int path_umount(struct path \*path, int flags)' fs/namespace.c; then
            echo "path_umount already present; no backport needed."
          else
            echo "::error::path_umount missing; apply a reviewed Linux 4.14 backport before building."
            exit 1
          fi

      - name: Apply Xen-Kernel KSUN manual hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-ksun-manual-hooks.py
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -Eq 'ksu_handle_sys_read|ksu_vfs_read_hook' fs/read_write.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          git diff --check

      - name: Configure manual hook, SuSFS and ThinLTO
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          LLVM_VARS=(
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf
            HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LLVM=1 LLVM_IAS=1
          )
          KMAKE=(make ARCH=arm64 O=out "${LLVM_VARS[@]}")
          "${KMAKE[@]}" vayu_defconfig

          scripts/config --file out/.config \
            --set-str LOCALVERSION "-Xen-KSUN+2" \
            --disable LOCALVERSION_AUTO \
            --enable MODULES \
            --disable KPROBES \
            --disable KRETPROBES \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_KPROBES_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_TRY_UMOUNT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_SUS_MEMFD \
            --enable LTO_CLANG \
            --enable LTO \
            --enable THINLTO \
            --disable LTO_NONE \
            --enable CC_OPTIMIZE_FOR_PERFORMANCE \
            --disable CC_OPTIMIZE_FOR_SIZE

          "${KMAKE[@]}" olddefconfig

          required=(
            CONFIG_MODULES CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_TRY_UMOUNT
            CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_LTO CONFIG_LTO_CLANG CONFIG_THINLTO
            CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
          )
          for symbol in "${required[@]}"; do
            grep -q "^$symbol=y$" out/.config || {
              echo "::error::$symbol is not enabled after olddefconfig"
              exit 1
            }
          done

          for symbol in CONFIG_KPROBES CONFIG_KRETPROBES CONFIG_KSU_KPROBES_HOOK \
                        CONFIG_KSU_SYSCALL_TABLE_HOOK CONFIG_LTO_NONE CONFIG_CC_OPTIMIZE_FOR_SIZE; do
            if grep -q "^$symbol=y$" out/.config; then
              echo "::error::$symbol must remain disabled"
              exit 1
            fi
          done

          cp out/.config baseline-ksun-susfs.config
          grep -E '^(CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_SUSFS|LTO|LTO_CLANG|THINLTO|CC_OPTIMIZE_FOR_PERFORMANCE)=|# CONFIG_(KPROBES|KRETPROBES|LTO_NONE|CC_OPTIMIZE_FOR_SIZE) is not set)' out/.config

          KERNEL_RELEASE="$("${KMAKE[@]}" --no-print-directory -s kernelrelease 2>/dev/null)"
          echo "Expected kernel release: 4.14.357-Xen-KSUN+2"
          echo "Actual kernel release:   $KERNEL_RELEASE"
          test "$KERNEL_RELEASE" = "4.14.357-Xen-KSUN+2" || {
            echo "::error::Kernel release does not match 4.14.357-Xen-KSUN+2"
            exit 1
          }

      - name: Build kernel Image
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER=Lvyana
          export KBUILD_BUILD_HOST=Xen-Kernel
          set +e
          make -j"$(nproc)" O=out ARCH=arm64 SUBARCH=arm64 DTC_EXT=dtc \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf \
            HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld \
            LLVM=1 LLVM_IAS=1 CC="ccache clang" Image 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          ccache -s || true
          if [ "$status" -ne 0 ]; then
            grep -n -m 30 -E 'error:|undefined (symbol|reference)|ld.lld: error|Error [0-9]+$' build.log || true
            echo "::error::Kernel compilation failed"
            exit "$status"
          fi
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image
          cat out/include/config/kernel.release
          echo "ThinLTO .llvm. symbol count: $(grep -c '\.llvm\.' out/System.map || true)"

      - name: Collect diagnostics and artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          [[ ! -f build.log ]] || cp build.log artifacts/
          [[ ! -f baseline-ksun-susfs.config ]] || cp baseline-ksun-susfs.config artifacts/
          [[ ! -f out/.config ]] || cp out/.config artifacts/kernel.config
          [[ ! -s out/arch/arm64/boot/Image ]] || cp out/arch/arm64/boot/Image artifacts/
          [[ ! -f out/include/config/kernel.release ]] || cp out/include/config/kernel.release artifacts/kernel-release.txt
          git rev-parse HEAD > artifacts/source-commit.txt 2>/dev/null || true
          if [[ -d KernelSU-Next/.git ]]; then
            git -C KernelSU-Next rev-parse HEAD > artifacts/ksun-commit.txt 2>/dev/null || true
            git -C KernelSU-Next diff --stat > artifacts/ksun-compat-diffstat.txt 2>/dev/null || true
          fi
          clang --version > artifacts/clang-version.txt 2>&1 || true
          ccache -s > artifacts/ccache-stats.txt 2>&1 || true
          find artifacts -type f -exec ls -lh '{}' \;

      - name: Upload Xen-Kernel SuSFS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-SuSFS
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
