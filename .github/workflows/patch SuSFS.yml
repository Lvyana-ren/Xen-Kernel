name: Xen-Kernel - Stage SUSFS sources (Linux 4.14 audit)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xen-susfs-source-import-16-KSUN_SuSFS
  cancel-in-progress: false

jobs:
  import-susfs-sources:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Xen-Kernel target branch
        uses: actions/checkout@v4
        with:
          ref: 16-KSUN_SuSFS
          fetch-depth: 0

      - name: Prepare audit directory
        shell: bash
        run: mkdir -p susfs-audit

      - name: Fetch Xen-SuSFS source branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch 16-ksu \
            https://github.com/Lvyana-ren/Xen-SuSFS.git \
            "$RUNNER_TEMP/Xen-SuSFS"

          SRC="$RUNNER_TEMP/Xen-SuSFS"
          {
            echo "Repository: https://github.com/Lvyana-ren/Xen-SuSFS"
            echo "Branch: 16-ksu"
            echo "Commit: $(git -C "$SRC" rev-parse HEAD)"
            echo "Commit subject: $(git -C "$SRC" log -1 --pretty=%s)"
            echo
            grep -m1 '^#define SUSFS_VERSION ' "$SRC/include/linux/susfs.h" || true
          } | tee susfs-audit/source-revision.txt

      - name: Fetch Linux 4.14 SUSFS patch for audit only
        shell: bash
        run: |
          set -euo pipefail
          PATCH_REPO="$RUNNER_TEMP/susfs4ksu-reference"
          git clone --depth=1 --single-branch --branch master \
            https://gitlab.com/simonpunk/susfs4ksu.git "$PATCH_REPO"

          PATCH_FILE="$PATCH_REPO/kernel_patches/50_add_susfs_in_kernel-4.14.patch"
          test -s "$PATCH_FILE"

          cp "$PATCH_FILE" susfs-audit/50_add_susfs_in_kernel-4.14.patch
          git -C "$PATCH_REPO" rev-parse HEAD > susfs-audit/upstream-master-commit.txt

          python3 - "$PATCH_FILE" <<'PY' > susfs-audit/patch-4.14-touched-files.txt
          import sys
          from pathlib import Path

          patch = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          paths = []
          for line in patch:
              if line.startswith("diff --git a/"):
                  left = line.split(" b/", 1)[0][len("diff --git a/"):]
                  if left and left not in paths:
                      paths.append(left)
          print("Files modified by upstream Linux 4.14 SUSFS patch:")
          print("(Reference/audit list only; this workflow does not apply these hunks.)")
          print()
          for path in paths:
              print(path)
          PY

          {
            echo "Upstream reference: https://gitlab.com/simonpunk/susfs4ksu/-/blob/master/kernel_patches/50_add_susfs_in_kernel-4.14.patch"
            echo "Patch repository commit: $(cat susfs-audit/upstream-master-commit.txt)"
            echo "Patch file: kernel_patches/50_add_susfs_in_kernel-4.14.patch"
            echo
            if grep -q 'Master repo will stay on version 1.3.8 forever' "$PATCH_REPO/README.md"; then
              echo "WARNING: upstream master README says master is frozen at SUSFS 1.3.8."
              echo "Xen-SuSFS source version must not be mixed blindly with this patch."
            fi
          } | tee susfs-audit/reference-warning.txt

      - name: Import only SUSFS implementation source files
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/Xen-SuSFS"

          # These three files form the source-file set in Xen-SuSFS v2.x.
          # Kernel call-site edits, Kconfig, Makefiles, defconfig and KSUN hooks
          # are intentionally left untouched for the next integration stages.
          python3 - "$SRC" "$GITHUB_WORKSPACE" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          src_root = Path(sys.argv[1])
          dst_root = Path(sys.argv[2])
          files = (
              "fs/susfs.c",
              "include/linux/susfs.h",
              "include/linux/susfs_def.h",
          )

          # Preflight all files first: never partially copy and never overwrite
          # a target file that differs from the selected Xen-SuSFS source.
          problems = []
          to_copy = []
          for rel in files:
              src = src_root / rel
              dst = dst_root / rel
              if not src.is_file():
                  problems.append(f"Source file missing: {rel}")
                  continue
              if dst.exists():
                  if not dst.is_file():
                      problems.append(f"Target exists but is not a file: {rel}")
                  elif src.read_bytes() != dst.read_bytes():
                      problems.append(
                          f"Target differs from source; refusing to overwrite: {rel}"
                      )
              else:
                  to_copy.append((src, dst, rel))

          if problems:
              print("Preflight failed; no source files were copied:", file=sys.stderr)
              for problem in problems:
                  print(f" - {problem}", file=sys.stderr)
              raise SystemExit(1)

          for src, dst, rel in to_copy:
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              print(f"COPIED: {rel}")
          for rel in files:
              dst = dst_root / rel
              if dst.exists():
                  print(f"VERIFIED: {rel}")
          if not to_copy:
              print("All three SUSFS source files already exist and match Xen-SuSFS.")
          PY

      - name: Audit source version and suspicious constants
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/Xen-SuSFS"

          {
            echo "===== SUSFS source version ====="
            grep -m1 '^#define SUSFS_VERSION ' include/linux/susfs.h || true
            echo
            echo "===== Imported files and SHA-256 ====="
