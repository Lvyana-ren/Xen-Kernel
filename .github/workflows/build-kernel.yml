
name: Xen-Kernel KSUN Manual Hook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Xen-Kernel source
        uses: actions/checkout@v4
        with:
          ref: 16-KSUN_Manual_hook
          fetch-depth: 1
          lfs: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      - name: Install official KernelSU-Next Legacy source
        shell: bash
        run: |
          set -euo pipefail

          if [ -e KernelSU-Next ] || [ -e KernelSU ]; then
            echo "::error::A KernelSU source directory already exists."
            echo "Check the current source tree before continuing."
            exit 1
          fi

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksun-setup.sh

          bash /tmp/ksun-setup.sh legacy

          test -d KernelSU-Next/kernel
          test -e drivers/kernelsu

          echo "===== Installed KernelSU-Next revision ====="
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next describe --tags --always || true

      - name: Apply Xen-Kernel Manual Hook integration
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/apply-ksun-manual-hooks.py

          python3 scripts/apply-ksun-manual-hooks.py

          echo "===== Verify all five hooks ====="
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c
          grep -n 'ksu_handle_sys_read\|ksu_vfs_read_hook' fs/read_write.c
          grep -n 'ksu_handle_stat' fs/stat.c
          grep -n 'ksu_handle_sys_reboot' kernel/reboot.c

          git diff --check

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          sed -i \
            's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION = -openela-Xen-KSUN/' \
            Makefile

          # Find the actual vayu defconfig in this source tree.
          DEFCONFIG_PATH=""

          for candidate in \
            arch/arm64/configs/vayu_defconfig \
            arch/arm64/configs/vayu_user_defconfig \
            arch/arm64/configs/vendor/vayu_user_defconfig
          do
            if [ -f "$candidate" ]; then
              DEFCONFIG_PATH="$candidate"
              break
            fi
          done

          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "::error::No known vayu defconfig was found."
            echo "Available vayu configs:"
            find arch/arm64/configs -type f -iname '*vayu*' -print || true
            exit 1
          fi

          DEFCONFIG="${DEFCONFIG_PATH#arch/arm64/configs/}"
          echo "Using defconfig: $DEFCONFIG"

          make O=out "$DEFCONFIG"

          scripts/config --file out/.config \
            --enable MODULES \
            --enable KPROBES \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_KPROBES_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK

          make O=out olddefconfig

          echo "===== Effective KSUN configuration ====="
          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK)=' \
            out/.config || true

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "::error::Manual Hook is not enabled."
            exit 1
          fi

      - name: Download Clang toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang

          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Build Xen-Kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out

          set +e
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Kernel compilation failed."
            exit "$BUILD_STATUS"
          fi

          test -s out/arch/arm64/boot/Image

          echo "===== Kernel release ====="
          make -s O=out kernelrelease

      - name: Collect build artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          [ ! -f build.log ] || cp build.log artifacts/
          [ ! -f out/.config ] || cp out/.config artifacts/kernel.config

          [ ! -f out/arch/arm64/boot/Image ] || \
            cp out/arch/arm64/boot/Image artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz ] || \
            cp out/arch/arm64/boot/Image.gz artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz-dtb ] || \
            cp out/arch/arm64/boot/Image.gz-dtb artifacts/

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f -name '*.dtb' \
              -exec cp --parents '{}' artifacts/ \; || true
          fi

          git rev-parse HEAD > artifacts/source-commit.txt

          if [ -d KernelSU-Next/.git ]; then
            git -C KernelSU-Next rev-parse HEAD \
              > artifacts/ksun-commit.txt
          fi

          make -s O=out kernelrelease \
            > artifacts/kernel-release.txt 2>&1 || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-Manual-Hook
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7