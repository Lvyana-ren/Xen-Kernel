
name: Xen-Kernel KSUN DEBUGING 

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xen-ksun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: "%compiler% --version"
      KBUILD_BUILD_USER: Lvyana
      KBUILD_BUILD_HOST: Xen-Kernel

    steps:
      # 1. Checkout Xen-Kernel
      - name: Checkout Xen-Kernel source
        uses: actions/checkout@v4
        with:
          ref: "16-KSUN-DEBUGING"
          fetch-depth: 1

      
      # 2. Install KSUN first to fail fast
      - name: Install KernelSU Next Legacy
        shell: bash
        env:
          # Pin ke revisi KSUN yang ingin diuji.
          KSUN_PIN: "v3.4.1-legacy"
        run: |
          set -euo pipefail

          if [ -e KernelSU-Next ] || [ -e KernelSU ]; then
            echo "::error::KSUN source directory already exists."
            exit 1
          fi

          # Ambil setup script dari fork Xen.
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Lvyana-ren/KernelSU-Next/dev/kernel/setup.sh" \
            -o /tmp/ksun-setup.sh

          # Pasang integrasi legacy untuk kernel non-GKI.
          bash /tmp/ksun-setup.sh legacy

          # Pin source setelah setup selesai.
          if [ -n "${KSUN_PIN:-}" ]; then
            echo "===== Fetch KSUN tags ====="
            git -C KernelSU-Next fetch --tags origin

            echo "===== Verify requested KSUN revision ====="
            if ! git -C KernelSU-Next rev-parse --verify \
              "${KSUN_PIN}^{commit}" >/dev/null 2>&1; then
              echo "::error::KSUN revision tidak ditemukan: ${KSUN_PIN}"
              echo "Tag yang tersedia:"
              git -C KernelSU-Next tag --list '*legacy*'
              exit 1
            fi

            echo "===== Checkout pinned KSUN revision ====="
            git -C KernelSU-Next switch --detach "${KSUN_PIN}"
          fi

          # Pastikan source dan integrasi tersedia.
          test -d KernelSU-Next/kernel
          test -e drivers/kernelsu

          if ! grep -q "KSU_MANUAL_HOOK" KernelSU-Next/kernel/Kconfig; then
            echo "::error::Ref KSUN ini tidak menyediakan KSU_MANUAL_HOOK."
            exit 1
          fi

          if ! grep -q "kernelsu" drivers/Kconfig; then
            echo "::error::drivers/Kconfig tidak meng-source Kconfig KernelSU."
            exit 1
          fi

          echo "===== KSUN source remote ====="
          git -C KernelSU-Next remote get-url origin

          echo "===== KSUN commit ====="
          git -C KernelSU-Next describe --tags --always
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next log --oneline -3


      # 3. Backport path_umount for Linux 4.14
      - name: Backport path_umount
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("fs/namespace.c")
          text = path.read_text()

          signature = "int path_umount(struct path *path, int flags)"

          if signature in text:
              print("path_umount already exists; skipping.")
              raise SystemExit(0)

          pattern = re.compile(
              r"(?m)^#ifdef[ \t]+CONFIG_MANDATORY_FILE_LOCKING[ \t]*\n"
              r".*?"
              r"(?m:^#endif[ \t]*\n)",
              re.DOTALL,
          )

          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  "Cannot uniquely locate mandatory locking block; "
                  f"found {len(matches)} matches."
              )

          backport = r'''
          /*
           * Xen-Kernel compatibility backport:
           * path_umount() for kernels older than Linux 5.9.
           */
          static int can_umount(const struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);

              if (flags & ~(MNT_FORCE | MNT_DETACH |
                            MNT_EXPIRE | UMOUNT_NOFOLLOW))
                  return -EINVAL;

              if (!may_mount())
                  return -EPERM;

              if (path->dentry != path->mnt->mnt_root)
                  return -EINVAL;

              if (!check_mnt(mnt))
                  return -EINVAL;

              if (mnt->mnt.mnt_flags & MNT_LOCKED)
                  return -EINVAL;

              if ((flags & MNT_FORCE) && !capable(CAP_SYS_ADMIN))
                  return -EPERM;

              return 0;
          }

          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret;

              ret = can_umount(path, flags);
              if (!ret)
                  ret = do_umount(mnt, flags);

              dput(path->dentry);
              mntput_no_expire(mnt);

              return ret;
          }
          '''

          match = matches[0]
          text = text[:match.end()] + backport + text[match.end():]
          path.write_text(text)

          print("path_umount backport applied.")
          PY

          grep -n -A 8 \
            'int path_umount(struct path \*path, int flags)' \
            fs/namespace.c

          git diff --check

      # 4. Apply existing Xen-Kernel manual hook patch
      - name: Apply KSUN manual hooks
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/apply-ksun-manual-hooks.py
          python3 scripts/apply-ksun-manual-hooks.py

          echo "===== Verify manual hook points ====="
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c
          grep -n 'ksu_handle_sys_read\|ksu_vfs_read_hook' fs/read_write.c
          grep -n 'ksu_handle_stat' fs/stat.c
          grep -n 'ksu_handle_sys_reboot' kernel/reboot.c

          git diff --check

      # 5. Install build dependencies
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            bc bison build-essential ccache flex git curl \
            libelf-dev libssl-dev make python3 rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libncurses-dev lz4 zip wget xz-utils file

      # 6. Restore compiler cache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-xen-ksun-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-xen-ksun-ccache-

      # 7. Restore the exact baseline toolchain source
      - name: Restore baseline Clang cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: ${{ runner.os }}-xen-clang-r547379-branch15.0-v1

      - name: Prepare baseline Clang
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -x "$HOME/clang/bin/clang" ] ||
             [ ! -x "$HOME/clang/bin/ld.lld" ]; then

            rm -rf "$HOME/clang"

            git clone --depth=1 \
              --single-branch \
              --branch 15.0 \
              https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
              "$HOME/clang"

            rm -rf "$HOME/clang/.git"
          fi

          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

          echo "===== Actual Clang version ====="
          "$HOME/clang/bin/clang" --version

          echo "===== Actual LLD version ====="
          "$HOME/clang/bin/ld.lld" --version

          echo "===== Clang target ====="
          "$HOME/clang/bin/clang" -dumpmachine

      # 8. Validate source
      - name: Validate source and toolchains
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/vayu_defconfig
          test -f scripts/config
          test -f scripts/apply-ksun-manual-hooks.py

          echo "===== Source commit ====="
          git rev-parse HEAD

          echo "===== Kernel version ====="
          make kernelversion

          echo "===== GCC64 ====="
          aarch64-linux-gnu-gcc --version

          echo "===== GCC32 ====="
          arm-linux-gnueabi-gcc --version

          echo "===== Clang ====="
          clang --version

          echo "===== LLD ====="
          ld.lld --version

      # 9. Generate configuration
      - name: Configure KSUN manual hook without KPROBES
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/clang/bin:$PATH"

          # --- DIAGNOSIS LTO: config memakai variabel toolchain yang sama dengan build ---
          LLVM_VARS=(
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf
            HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LLVM=1 LLVM_IAS=1
          )
          KMAKE=(make ARCH=arm64 O=out "${LLVM_VARS[@]}")

          lto_state() {
            echo "----- LTO @ $1 -----"
            grep -E '^(CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE)=|# CONFIG_(LTO_CLANG|LTO_NONE) is not set)' \
              "${2:-out/.config}" || echo "(tidak ada baris LTO)"
          }

          "${KMAKE[@]}" vayu_defconfig
          lto_state "A  : langsung dari vayu_defconfig (DENGAN variabel toolchain)"

          # Pembanding: cara lama (tanpa variabel toolchain), di folder terpisah.
          make ARCH=arm64 O=out_noenv vayu_defconfig > /dev/null
          lto_state "A' : langsung dari vayu_defconfig (TANPA variabel toolchain)" out_noenv/.config
          rm -rf out_noenv

          scripts/config --file out/.config \
            --set-str LOCALVERSION "-Xen-KSUN" \
            --disable LOCALVERSION_AUTO \
            --enable MODULES \
            --disable KPROBES \
            --disable KRETPROBES \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_KPROBES_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK \
            --enable LTO_CLANG \
            --enable LTO \
            --enable THINLTO \
            --disable LTO_NONE

          lto_state "B  : setelah scripts/config, sebelum olddefconfig"

          "${KMAKE[@]}" olddefconfig
          lto_state "C  : setelah olddefconfig"

          if ! grep -q '^CONFIG_LTO_CLANG=y' out/.config; then
            echo "===== LTO_CLANG gugur: cari penyebabnya (kconfig-why) ====="
            if [ -f scripts/kconfig-why.py ]; then
              python3 scripts/kconfig-why.py LTO_CLANG THINLTO out/.config || true
            else
              echo "scripts/kconfig-why.py tidak ada di repo; salin dulu filenya."
            fi
          else
            echo "===== LTO_CLANG AKTIF setelah olddefconfig -> kconfig-why dilewati ====="
          fi

          echo "===== Final LTO config ====="
          grep -E '^(CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE|ARCH_SUPPORTS_LTO_CLANG|ARCH_SUPPORTS_THINLTO)=|# CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE) is not set)' out/.config

          if ! grep -q '^CONFIG_LTO=y$' out/.config ||
             ! grep -q '^CONFIG_LTO_CLANG=y$' out/.config ||
             ! grep -q '^CONFIG_THINLTO=y$' out/.config ||
             grep -q '^CONFIG_LTO_NONE=y$' out/.config; then
            echo "::error::ThinLTO is not enabled in final .config"
            exit 1
          fi

          cp out/.config baseline-ksun.config

          echo "===== Effective configuration ====="
          grep -E \
            '^(CONFIG_(LOCALVERSION|MODULES|KPROBES|KRETPROBES|KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK))=' \
            out/.config || true

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "::error::KSUN manual hook is not enabled."
            exit 1
          fi

          if grep -q '^CONFIG_KPROBES=y' out/.config; then
            echo "::error::KPROBES was re-enabled by Kconfig."
            exit 1
          fi

          if grep -q '^CONFIG_KRETPROBES=y' out/.config; then
            echo "::error::KRETPROBES was re-enabled by Kconfig."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y' out/.config; then
            echo "::error::KSUN KPROBES hook is enabled."
            exit 1
          fi

          echo "===== Kernel release ====="
          "${KMAKE[@]}" kernelrelease

      # 10. Compile using baseline compiler arguments
      - name: Compile Xen-Kernel Image
        shell: bash
        run: |
          set -uo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Lvyana"
          export KBUILD_BUILD_HOST="Xen-Kernel"

          set +e
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            DTC_EXT=dtc \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            Image 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          ccache -s || true

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "===== 25 baris error pertama dari build.log ====="
            grep -n -m 25 -E 'error:|undefined (symbol|reference)|ld.lld: error|Error [0-9]+$' build.log || true
            echo "::error::Kernel compilation failed."
            exit "$BUILD_STATUS"
          fi

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image is missing or empty."
            exit 1
          fi

          echo "===== Kernel Image ====="
          file "$IMAGE"
          ls -lh "$IMAGE"

          echo "===== Kernel release ====="
          # Baca file hasil build; jangan panggil make lagi tanpa variabel toolchain
          # (make akan mengevaluasi ulang Makefile/config dengan gcc bawaan).
          cat out/include/config/kernel.release

          # Bukti LTO dari HASIL build (bukan dari .config yang bisa berubah setelahnya)
          echo "===== Cek LTO di hasil build ====="
          if [ -x scripts/extract-ikconfig ]; then
            scripts/extract-ikconfig "$IMAGE" 2>/dev/null \
              | grep -E '^(CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE)=|# CONFIG_LTO_CLANG is not set)' \
              || echo "(config tertanam di Image tidak terbaca)"
          fi
          echo "simbol .llvm. di System.map: $(grep -c '\.llvm\.' out/System.map || true)  (>0 = ThinLTO)"

      # 11. Collect artifacts even when compilation fails
      - name: Collect diagnostics and artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p artifacts

          [[ ! -f build.log ]] || cp build.log artifacts/
          [[ ! -f baseline-ksun.config ]] || cp baseline-ksun.config artifacts/

          if [[ -f out/.config ]]; then
            cp out/.config artifacts/kernel.config
          fi

          if [[ -s out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi

          if [[ -s out/arch/arm64/boot/Image.gz ]]; then
            cp out/arch/arm64/boot/Image.gz artifacts/
          fi

          if [[ -s out/arch/arm64/boot/dtbo.img ]]; then
            cp out/arch/arm64/boot/dtbo.img artifacts/
          fi

          if [[ -s out/arch/arm64/boot/dtb.img ]]; then
            cp out/arch/arm64/boot/dtb.img artifacts/
          fi

          if [[ -f out/include/config/kernel.release ]]; then
            cp out/include/config/kernel.release artifacts/kernel-release.txt
          fi

          git rev-parse HEAD \
            > artifacts/source-commit.txt 2>/dev/null || true

          if [[ -d KernelSU-Next/.git ]]; then
            git -C KernelSU-Next rev-parse HEAD \
              > artifacts/ksun-commit.txt 2>/dev/null || true
          fi

          clang --version > artifacts/clang-version.txt 2>&1 || true
          ccache -s > artifacts/ccache-stats.txt 2>&1 || true

          echo "===== Artifacts ====="
          find artifacts -type f -exec ls -lh '{}' \;

      # 12. Upload artifacts even on failure
      - name: Upload Xen-Kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-Debug-fail
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7