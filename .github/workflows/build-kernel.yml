
name: Xen-Kernel-KSUN - Manual Hook Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Xen-Kernel source
        uses: actions/checkout@v4
        with:
          ref: "16-KSUN_Manual_hook"
          fetch-depth: 1
          lfs: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      - name: Integrate KernelSU-Next Legacy
        shell: bash
        run: |
          set -euo pipefail

          if [ -e KernelSU-Next ] || [ -e KernelSU ]; then
            echo "::error::KernelSU directory already exists."
            exit 1
          fi

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-next-setup.sh

          bash /tmp/ksu-next-setup.sh legacy

          test -d KernelSU-Next/kernel
          test -f drivers/kernelsu/Kconfig

          echo "===== KernelSU-Next revision ====="
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next describe --tags --always || true

      - name: Inspect Manual Hook integration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== KSUN hook configuration ====="
          grep -n -E \
            'KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK' \
            KernelSU-Next/kernel/Kconfig || true

          echo "===== Handler declarations and call sites ====="
          grep -R -n -E \
            'ksu_handle_(execveat|faccessat|sys_reboot)' \
            fs kernel \
            --include='*.c' || true

          echo "===== Check whitespace ====="
          git diff --check

          if ! grep -q 'config KSU_MANUAL_HOOK' \
            KernelSU-Next/kernel/Kconfig; then
            echo "::error::KSU_MANUAL_HOOK was not found in this KSUN revision."
            exit 1
          fi

          if ! grep -q 'ksu_handle_execveat' fs/exec.c; then
            echo "::error::Missing execveat handler in fs/exec.c."
            exit 1
          fi

          if ! grep -q 'ksu_handle_faccessat' fs/open.c; then
            echo "::error::Missing faccessat handler in fs/open.c."
            exit 1
          fi

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          make O=out vayu_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_KPROBES_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK

          make O=out olddefconfig

          echo "===== Relevant final configuration ====="
          grep -E \
            'CONFIG_(MODULES|KPROBES|KRETPROBES|KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK)=' \
            out/.config || true

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config

      - name: Set Xen-Kernel version string
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Original kernel version ====="
          grep -n -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          # Set the requested release suffix.
          sed -i \
            's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION = -openela-Xen-KSUN/' \
            Makefile

          # Verify the suffix exists.
          grep -q '^EXTRAVERSION = -openela-Xen-KSUN$' Makefile

          echo "===== Verify resulting kernel release ====="
          RELEASE="$(make -s O=out kernelrelease)"
          echo "$RELEASE"

          if [ "$RELEASE" != "4.14.357-openela-Xen-KSUN" ]; then
            echo "::error::Unexpected kernel release: $RELEASE"
            echo "Expected: 4.14.357-openela-Xen-KSUN"
            exit 1
          fi

      - name: Download Clang toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang

          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Build Xen-Kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out

          set +e
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Kernel compilation failed."
            exit "$BUILD_STATUS"
          fi

          test -s out/arch/arm64/boot/Image

          echo "===== Final kernel release ====="
          make -s O=out kernelrelease

      - name: Collect build artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          [ ! -f build.log ] || cp build.log artifacts/
          [ ! -f out/.config ] || cp out/.config artifacts/kernel.config

          [ ! -f out/arch/arm64/boot/Image ] || \
            cp out/arch/arm64/boot/Image artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz ] || \
            cp out/arch/arm64/boot/Image.gz artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz-dtb ] || \
            cp out/arch/arm64/boot/Image.gz-dtb artifacts/

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f -name '*.dtb' \
              -exec cp --parents '{}' artifacts/ \; || true
          fi

          git -C KernelSU-Next rev-parse HEAD \
            > artifacts/ksun-commit.txt 2>/dev/null || true

          git rev-parse HEAD > artifacts/source-commit.txt

          make -s O=out kernelrelease \
            > artifacts/kernel-release.txt 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-Manual-Hook
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
```
