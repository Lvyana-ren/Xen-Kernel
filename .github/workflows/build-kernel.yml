name: Xen-Kernel - KowSU Integration

on:
  workflow_dispatch:
  push:
    branches:
      - KowSU

permissions:
  contents: read

concurrency:
  group: xen-kowsu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Lvyana
      KBUILD_BUILD_HOST: Xen-Kernel
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: "%compiler% --version

    steps:
      - name: Checkout Xen-Kernel KowSU branch
        uses: actions/checkout@v4
        with:
          ref: KowSU
          fetch-depth: 1
          lfs: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git curl libelf-dev libssl-dev make \
            python3 rsync device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libncurses-dev lz4 zip wget xz-utils file

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-xen-kowsu-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-xen-kowsu-

      - name: Prepare Clang r547379
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/clang/bin/clang" ] || [ ! -x "$HOME/clang/bin/ld.lld" ]; then
            rm -rf "$HOME/clang"
            git clone --depth=1 --single-branch --branch 15.0 \
              https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git "$HOME/clang"
            rm -rf "$HOME/clang/.git"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/ld.lld" --version

      - name: Remove vendor suffix from kernel version
        run: |
          set -euo pipefail
          sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION =/' Makefile
          test "$(make kernelversion)" = "4.14.357"

      - name: Guard hyp_core_ctl cpu_subsys include
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path("drivers/soc/qcom/hyp_core_ctl.c")
          hdr = Path("include/linux/cpu.h")
          text = src.read_text()
          if "cpu_subsys" in text and "cpu_subsys" not in hdr.read_text():
              raise SystemExit("cpu_subsys declaration missing from include/linux/cpu.h")
          if "cpu_subsys" in text and "#include <linux/cpu.h>" not in text:
              anchor = "#include <linux/init.h>"
              if anchor not in text:
                  raise SystemExit("No safe include anchor in hyp_core_ctl.c")
              src.write_text(text.replace(anchor, anchor + "\\n#include <linux/cpu.h>", 1))
          PY

      - name: Ensure ZRAM default compressor is LZ4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("drivers/block/zram/zram_drv.c")
          s = p.read_text()
          m = re.search(r'(?m)^\\s*static const char \\*default_compressor\\s*=\\s*"([^"]+)"\\s*;', s)
          if not m:
              raise SystemExit("Could not safely locate default_compressor")
          if m.group(1) != "lz4":
              p.write_text(s[:m.start(1)] + "lz4" + s[m.end(1):])
          PY

      - name: Integrate pinned KowSU source
        env:
          KOWSU_REPO: https://github.com/KOWX712/KernelSU
          KOWSU_SHA: 21787ce135c988bae4244a44cfcb5a542aa3347f
        run: |
          set -euo pipefail
          git clone --no-checkout "$KOWSU_REPO" KernelSU
          git -C KernelSU checkout --detach "$KOWSU_SHA"
          test "$(git -C KernelSU rev-parse HEAD)" = "$KOWSU_SHA"
          grep -q 'depends on KPROBES && EXT4_FS' KernelSU/kernel/Kconfig
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || printf '\\nobj-$(CONFIG_KSU) += kernelsu/\\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          git diff --check
          echo "Pinned KowSU: $(git -C KernelSU log -1 --oneline)"

      - name: Configure Xen + KowSU + ThinLTO
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          LLVM_VARS=(CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1)
          KMAKE=(make ARCH=arm64 O=out "${LLVM_VARS[@]}")
          "${KMAKE[@]}" vayu_defconfig
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-Xen-KowSU+1" --disable LOCALVERSION_AUTO \
            --enable KPROBES --enable KSU \
            --enable LTO --enable LTO_CLANG --enable THINLTO --disable LTO_NONE \
            --enable CC_OPTIMIZE_FOR_PERFORMANCE --disable CC_OPTIMIZE_FOR_SIZE
          "${KMAKE[@]}" olddefconfig
          for sym in CONFIG_KPROBES CONFIG_KSU CONFIG_LTO CONFIG_LTO_CLANG CONFIG_THINLTO CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE; do
            grep -q "^$sym=y$" out/.config || { echo "::error::$sym not enabled"; exit 1; }
          done
          for sym in CONFIG_LTO_NONE CONFIG_CC_OPTIMIZE_FOR_SIZE; do
            ! grep -q "^$sym=y$" out/.config || { echo "::error::$sym must be disabled"; exit 1; }
          done
          cp out/.config xen-kowsu.config
          "${KMAKE[@]}" kernelrelease

      - name: Build kernel Image
        run: |
          set -uo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64 SUBARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ \
            HOSTAR=llvm-ar HOSTLD=ld.lld LLVM=1 LLVM_IAS=1 CC="ccache clang" Image 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          test -s out/arch/arm64/boot/Image
          cat out/include/config/kernel.release

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp build.log artifacts/ 2>/dev/null || true
          cp xen-kowsu.config artifacts/ 2>/dev/null || true
          cp out/.config artifacts/kernel.config 2>/dev/null || true
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/include/config/kernel.release artifacts/kernel-release.txt 2>/dev/null || true
          git rev-parse HEAD > artifacts/xen-commit.txt 2>/dev/null || true
          git -C KernelSU rev-parse HEAD > artifacts/kowsu-commit.txt 2>/dev/null || true
          clang --version > artifacts/clang-version.txt 2>&1 || true

      - name: Upload KowSU build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KowSU
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
