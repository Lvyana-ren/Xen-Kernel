
name: Xen-Kernel-KSUN - Anymore Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------
      # 1. Source Xen-Kernel
      # ------------------------------------------------------
      - name: Checkout Xen-Kernel
        uses: actions/checkout@v4
        with:
          ref: "16-KSUN_Manual_hook"
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      # ------------------------------------------------------
      # 2. Get the exact KSUN commit used by Anymore
      # ------------------------------------------------------
      - name: Resolve Anymore KernelSU-Next revision
        id: ksun
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth=1 \
            --branch 16-ksun \
            https://github.com/AnymoreProject/android_kernel_vayu.git \
            /tmp/anymore-reference

          KSUN_SHA="$(
            git -C /tmp/anymore-reference \
              ls-tree HEAD KernelSU-Next |
              awk '$2 == "commit" { print $3 }'
          )"

          if [ -z "$KSUN_SHA" ]; then
            echo "::error::Cannot resolve Anymore KernelSU-Next submodule commit."
            exit 1
          fi

          echo "KSUN_SHA=$KSUN_SHA" >> "$GITHUB_ENV"
          echo "Anymore KSUN revision: $KSUN_SHA"

      - name: Install pinned KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUN_SHA}/kernel/setup.sh" \
            -o /tmp/ksun-setup.sh

          bash /tmp/ksun-setup.sh "$KSUN_SHA"

          test -d KernelSU-Next/kernel
          test -L drivers/kernelsu

          ACTUAL_SHA="$(git -C KernelSU-Next rev-parse HEAD)"

          echo "Requested KSUN: $KSUN_SHA"
          echo "Installed KSUN: $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$KSUN_SHA" ]; then
            echo "::error::Installed KSUN does not match Anymore revision."
            exit 1
          fi

          echo "===== KSUN revision verified ====="

      # ------------------------------------------------------
      # 3. Apply Anymore-style source integration
      # ------------------------------------------------------
      - name: Apply Anymore KSUN hooks
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"PATCH ERROR: {label}: "
                      f"expected 1 match, found {count}"
                  )
              return text.replace(old, new, 1)

          def patch_function(text, start_marker, end_marker,
                             old, new, label):
              start = text.find(start_marker)

              if start < 0:
                  raise SystemExit(
                      f"PATCH ERROR: start of {label} not found"
                  )

              end = text.find(
                  end_marker,
                  start + len(start_marker)
              )

              if end < 0:
                  raise SystemExit(
                      f"PATCH ERROR: end of {label} not found"
                  )

              body = text[start:end]
              body = replace_once(body, old, new, label)

              return text[:start] + body + text[end:]

          # ==================================================
          # fs/exec.c
          # Match Anymore's do_execve/compat_do_execve calls.
          # ==================================================
          p = Path("fs/exec.c")
          text = p.read_text()

          if "ksu_handle_execveat" in text:
              raise SystemExit(
                  "PATCH ERROR: execve hook already exists"
              )

          declaration = (
              "#if defined(CONFIG_KSU)\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_execveat(int *fd, "
              "struct filename **filename_ptr,\n"
              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
              "#endif\n"
          )

          native_start = (
              "int do_execve(struct filename *filename,"
          )

          text = replace_once(
              text,
              native_start,
              declaration + native_start,
              "execve handler declaration",
          )

          exec_call = (
              "#if defined(CONFIG_KSU)\n"
              "\tksu_handle_execveat((int *)AT_FDCWD, "
              "&filename, &argv, &envp, 0);\n"
              "#endif\n"
              "\treturn do_execveat_common("
              "AT_FDCWD, filename, argv, envp, 0);"
          )

          text = patch_function(
              text,
              native_start,
              "\nint do_execveat(",
              "\treturn do_execveat_common("
              "AT_FDCWD, filename, argv, envp, 0);",
              exec_call,
              "do_execve hook",
          )

          compat_start = (
              "static int compat_do_execve("
              "struct filename *filename,"
          )

          compat_call = (
              "#if defined(CONFIG_KSU)\n"
              "\tksu_handle_execveat((int *)AT_FDCWD, "
              "&filename, &argv, &envp, 0);\n"
              "#endif\n"
              "\treturn do_execveat_common("
              "AT_FDCWD, filename, argv, envp, 0);"
          )

          text = patch_function(
              text,
              compat_start,
              "\nstatic int compat_do_execveat(",
              "\treturn do_execveat_common("
              "AT_FDCWD, filename, argv, envp, 0);",
              compat_call,
              "compat_do_execve hook",
          )

          p.write_text(text)

          # ==================================================
          # fs/open.c
          # ==================================================
          p = Path("fs/open.c")
          text = p.read_text()

          if "ksu_handle_faccessat" in text:
              raise SystemExit(
                  "PATCH ERROR: faccessat hook already exists"
              )

          open_start = (
              "SYSCALL_DEFINE3(faccessat, int, dfd, "
              "const char __user *, filename, int, mode)"
          )

          open_declaration = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_faccessat(int *dfd, "
              "const char __user **filename_user,\n"
              "\t\t\t\tint *mode, int *flags);\n"
              "#endif\n"
          )

          text = replace_once(
              text,
              open_start,
              open_declaration + open_start,
              "faccessat handler declaration",
          )

          faccess_call = (
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
              "#ifdef CONFIG_KSU\n"
              "\tksu_handle_faccessat(&dfd, &filename, "
              "&mode, NULL);\n"
              "#endif\n"
          )

          text = patch_function(
              text,
              open_start,
              "\nSYSCALL_DEFINE2(access,",
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n",
              faccess_call,
              "faccessat hook",
          )

          p.write_text(text)

          # ==================================================
          # kernel/reboot.c
          # ==================================================
          p = Path("kernel/reboot.c")
          text = p.read_text()

          if "ksu_handle_sys_reboot" in text:
              raise SystemExit(
                  "PATCH ERROR: reboot hook already exists"
              )

          reboot_start = (
              "SYSCALL_DEFINE4(reboot, int, magic1, "
              "int, magic2, unsigned int, cmd,"
          )

          reboot_declaration = (
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_sys_reboot("
              "int magic1, int magic2, unsigned int cmd, "
              "void __user **arg);\n"
              "#endif\n"
          )

          text = replace_once(
              text,
              reboot_start,
              reboot_declaration + reboot_start,
              "reboot handler declaration",
          )

          reboot_old = (
              "\tchar buffer[256];\n"
              "\tint ret = 0;\n"
          )

          reboot_new = (
              "\tchar buffer[256];\n"
              "\tint ret = 0;\n"
              "#ifdef CONFIG_KSU\n"
              "\tksu_handle_sys_reboot("
              "magic1, magic2, cmd, &arg);\n"
              "#endif\n"
          )

          text = replace_once(
              text,
              reboot_old,
              reboot_new,
              "reboot hook",
          )

          p.write_text(text)

          print("Anymore-style KSUN integration applied.")
          PY

          echo "===== Whitespace validation ====="
          git diff --check

          echo "===== Verify hook declarations and calls ====="
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c
          grep -n 'ksu_handle_sys_reboot' kernel/reboot.c

          echo "===== Modified files ====="
          git diff --stat

      # ------------------------------------------------------
      # 4. Kernel configuration
      # ------------------------------------------------------
      - name: Configure vayu kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          sed -i \
            's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION = -openela-Xen-KSUN/' \
            Makefile

          make O=out vayu_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable KPROBES \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_KPROBES_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK

          make O=out olddefconfig

          echo "===== KSUN config ====="
          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK)=' \
            out/.config || true

          grep -q '^CONFIG_KSU=y' out/.config || {
            echo "::error::CONFIG_KSU is not enabled"
            exit 1
          }

          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config || {
            echo "::error::Manual Hook is not enabled"
            exit 1
          }

      # ------------------------------------------------------
      # 5. Clang toolchain
      # ------------------------------------------------------
      - name: Download Clang
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang

          test -x clang/bin/clang
          clang/bin/clang --version

      # ------------------------------------------------------
      # 6. Compile
      # ------------------------------------------------------
      - name: Build Xen-Kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          set +e
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Kernel build failed"
            exit "$BUILD_STATUS"
          fi

          test -s out/arch/arm64/boot/Image

          echo "===== Kernel release ====="
          make -s O=out kernelrelease

      # ------------------------------------------------------
      # 7. Upload artifacts even if compilation fails
      # ------------------------------------------------------
      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          [ ! -f build.log ] || cp build.log artifacts/
          [ ! -f out/.config ] || cp out/.config artifacts/kernel.config

          [ ! -f out/arch/arm64/boot/Image ] || \
            cp out/arch/arm64/boot/Image artifacts/

          git rev-parse HEAD > artifacts/source-commit.txt

          if [ -d KernelSU-Next/.git ]; then
            git -C KernelSU-Next rev-parse HEAD \
              > artifacts/ksun-commit.txt
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-Anymore
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7