
name: Xen-Kernel-KSUN - Legacy Kprobe Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Xen-Kernel-KSUN source
        uses: actions/checkout@v4
        with:
          ref: "16-KSUN"
          fetch-depth: 1
          lfs: true

      - name: Integrate KernelSU Next Legacy
        run: |
          set -euo pipefail

          echo "=== Integrating KernelSU Next Legacy ==="

          if [ -d KernelSU-Next ] || [ -d KernelSU ]; then
            echo "::error::Existing KernelSU directory detected."
            exit 1
          fi

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-next-setup.sh

          bash /tmp/ksu-next-setup.sh legacy


echo "=== Verify KernelSU Next integration ==="

if [ ! -d "KernelSU-Next/kernel" ]; then
  echo "::error::KernelSU Next kernel source not found."
  exit 1
fi

if [ ! -L "drivers/kernelsu" ]; then
  echo "::error::KernelSU Next symlink drivers/kernelsu not found."
  exit 1
fi

if [ ! -f "drivers/kernelsu/Kconfig" ]; then
  echo "::error::KernelSU Next Kconfig not found."
  exit 1
fi

echo "=== KernelSU Next integration verified ==="
ls -ld drivers/kernelsu
git status --short

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache \
            clang flex git libelf-dev libssl-dev \
            lld llvm make python3 rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            libncurses-dev \
            lz4 zip wget xz-utils

      - name: Prepare upstream Clang
        run: |
          set -e

          mkdir -p "$HOME/clang"

          git clone --depth=1 \
            --single-branch \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            "$HOME/clang"

          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

          echo "=== Clang version ==="
          "$HOME/clang/bin/clang" --version

      - name: Check source and toolchains
        run: |
          set -e

          echo "=== Source commit ==="
          git log -1 --oneline

          echo "=== Kernel version ==="
          make kernelversion

          echo "=== Required source files ==="
          test -f Makefile
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/vayu_defconfig
          test -f scripts/config

          echo "=== GCC64 ==="
          aarch64-linux-gnu-gcc --version

          echo "=== GCC32 ==="
          arm-linux-gnueabi-gcc --version

          echo "=== LLVM tools ==="
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/ld.lld" --version
          "$HOME/clang/bin/llvm-ar" --version

      - name: Generate KSU defconfig
        run: |
          set -euo pipefail

          export ARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          make ARCH=arm64 O=out vayu_defconfig

          echo "=== Enable KernelSU Next Kprobe hooks ==="

          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable KPROBE_EVENTS
          scripts/config --file out/.config --enable KSU_KPROBE_HOOKS
          scripts/config --file out/.config --enable KSU

          scripts/config --file out/.config \
            --set-str LOCALVERSION "-Xen-KSUN"

          scripts/config --file out/.config \
            --disable LOCALVERSION_AUTO

          make ARCH=arm64 O=out olddefconfig

          echo "=== Verify final configuration ==="

          grep -E '^(CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)=|# CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS) is not set)' out/.config || true

          for option in KSU KPROBES KPROBE_EVENTS KSU_KPROBE_HOOKS; do
            if ! grep -qx "CONFIG_${option}=y" out/.config; then
              echo "::error::CONFIG_${option} is not enabled in final config."
              exit 1
            fi
          done

          cp out/.config baseline.config

          echo "=== Kernel version ==="
          make kernelversion

          echo "=== Kernel release ==="
          make ARCH=arm64 O=out kernelrelease

          echo "=== Local version ==="
          grep '^CONFIG_LOCALVERSION=' out/.config

      - name: Compile kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Lvyana"
          export KBUILD_BUILD_HOST="Xen-Kernel"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            DTC_EXT=dtc \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            2>&1 | tee build.log

      - name: Verify kernel image
        if: success()
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image not found."
            exit 1
          fi

          echo "=== Kernel image ==="
          file "$IMAGE"
          ls -lh "$IMAGE"

          echo "=== Final kernel release ==="
          make ARCH=arm64 O=out kernelrelease

          echo "=== Available build outputs ==="
          find out/arch/arm64/boot \
            -maxdepth 2 -type f \
            \( -name "Image*" -o -name "*.dtb" -o -name "dtbo.img" \) \
            -print

      - name: Upload Xen-Kernel-KSUN artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-legacy-kprobe
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dtb.img
            out/.config
            baseline.config
            build.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-diagnostics
          if-no-files-found: warn
          path: |
            build.log
            baseline.config
            out/.config