
name: Xen-Kernel-KSUN - Manual Hook Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Xen-Kernel source
        uses: actions/checkout@v4
        with:
          ref: "16-KSUN_Manual_hook"
          fetch-depth: 1
          lfs: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      - name: Integrate KernelSU-Next Legacy
        shell: bash
        run: |
          set -euo pipefail

          if [ -e KernelSU-Next ] || [ -e KernelSU ]; then
            echo "::error::KernelSU directory already exists."
            exit 1
          fi

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-next-setup.sh

          bash /tmp/ksu-next-setup.sh legacy

          test -d KernelSU-Next/kernel
          test -f drivers/kernelsu/Kconfig

          echo "===== KernelSU-Next revision ====="
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next describe --tags --always || true

      - name: Apply Manual Hook integration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"PATCH ERROR: {label}: expected 1 match, found {count}"
                  )
              return text.replace(old, new, 1)

          def patch_function(text, start_marker, end_marker,
                             old, new, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(
                      f"PATCH ERROR: function start not found: {label}"
                  )

              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(
                      f"PATCH ERROR: function boundary not found: {label}"
                  )

              body = text[start:end]
              body = replace_once(body, old, new, label)
              return text[:start] + body + text[end:]

          # -------------------------------------------------------
          # fs/exec.c
          # -------------------------------------------------------
          p = Path("fs/exec.c")
          text = p.read_text()

          if "ksu_handle_execveat" in text:
              raise SystemExit(
                  "PATCH ERROR: execveat hook already exists in fs/exec.c"
              )

          declaration = (
              "#if defined(CONFIG_KSU)\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_execveat(int *fd, "
              "struct filename **filename_ptr,\n"
              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
              "#endif\n"
          )

          text = replace_once(
              text,
              "int do_execve(struct filename *filename,\n",
              declaration + "int do_execve(struct filename *filename,\n",
              "execve handler declaration",
          )

          # Native execve: use real local variables for pointer arguments.
          text = patch_function(
              text,
              "int do_execve(struct filename *filename,",
              "int do_execveat(",
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
              (
                  "#if defined(CONFIG_KSU)\n"
                  "\tint fd = AT_FDCWD;\n"
                  "\tint flags = 0;\n"
                  "\tksu_handle_execveat(&fd, &filename, "
                  "&argv, &envp, &flags);\n"
                  "\treturn do_execveat_common(fd, filename, "
                  "argv, envp, flags);\n"
                  "#else\n"
                  "\treturn do_execveat_common(AT_FDCWD, "
                  "filename, argv, envp, 0);\n"
                  "#endif"
              ),
              "native execve hook",
          )

          # Compat execve: isolate its own function instead of using
          # a fragile regex that assumes exact whitespace and line endings.
          text = patch_function(
              text,
              "static int compat_do_execve(struct filename *filename,",
              "static int compat_do_execveat(",
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
              (
                  "#if defined(CONFIG_KSU)\n"
                  "\tint fd = AT_FDCWD;\n"
                  "\tint flags = 0;\n"
                  "\tksu_handle_execveat(&fd, &filename, "
                  "&argv, &envp, &flags);\n"
                  "\treturn do_execveat_common(fd, filename, "
                  "argv, envp, flags);\n"
                  "#else\n"
                  "\treturn do_execveat_common(AT_FDCWD, "
                  "filename, argv, envp, 0);\n"
                  "#endif"
              ),
              "compat execve hook",
          )

          p.write_text(text)

          # -------------------------------------------------------
          # fs/open.c
          # -------------------------------------------------------
          p = Path("fs/open.c")
          text = p.read_text()

          if "ksu_handle_faccessat" in text:
              raise SystemExit(
                  "PATCH ERROR: faccessat hook already exists in fs/open.c"
              )

          declaration = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_faccessat(int *dfd, "
              "const char __user **filename_user,\n"
              "\t\t\t\tint *mode, int *flags);\n"
              "#endif\n"
          )

          text = replace_once(
              text,
              "SYSCALL_DEFINE3(faccessat, int, dfd, "
              "const char __user *, filename, int, mode)",
              declaration
              + "SYSCALL_DEFINE3(faccessat, int, dfd, "
              "const char __user *, filename, int, mode)",
              "faccessat handler declaration",
          )

          text = patch_function(
              text,
              "SYSCALL_DEFINE3(faccessat, int, dfd, "
              "const char __user *, filename, int, mode)",
              "\n#ifdef CONFIG_COMPAT",
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n",
              (
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n"
              ),
              "faccessat hook",
          )

          p.write_text(text)

          print("Manual Hook source patches applied.")
          PY

          echo "===== Check whitespace ====="
          git diff --check

          echo "===== Hook locations ====="
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c

          echo "===== Changed files ====="
          git diff --stat

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          # Keep the requested Xen-Kernel release suffix.
          sed -i \
            's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION = -openela-Xen-KSUN/' \
            Makefile

          make O=out vayu_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_KPROBES_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK

          make O=out olddefconfig

          echo "===== KSUN configuration ====="
          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK)=' \
            out/.config || true

          grep -q '^CONFIG_KSU=y' out/.config

          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "::error::Manual Hook configuration is not enabled."
            exit 1
          fi

      - name: Download Clang toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang

          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Build Xen-Kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out

          set +e
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Kernel compilation failed."
            exit "$BUILD_STATUS"
          fi

          test -s out/arch/arm64/boot/Image

          echo "===== Kernel release ====="
          make -s O=out kernelrelease

      - name: Collect build artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          [ ! -f build.log ] || cp build.log artifacts/
          [ ! -f out/.config ] || cp out/.config artifacts/kernel.config

          [ ! -f out/arch/arm64/boot/Image ] || \
            cp out/arch/arm64/boot/Image artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz ] || \
            cp out/arch/arm64/boot/Image.gz artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz-dtb ] || \
            cp out/arch/arm64/boot/Image.gz-dtb artifacts/

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f -name '*.dtb' \
              -exec cp --parents '{}' artifacts/ \; || true
          fi

          git rev-parse HEAD > artifacts/source-commit.txt

          git -C KernelSU-Next rev-parse HEAD \
            > artifacts/ksun-commit.txt 2>/dev/null || true

          make -s O=out kernelrelease \
            > artifacts/kernel-release.txt 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-Manual-Hook
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7