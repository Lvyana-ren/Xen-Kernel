name: Xen-Kernel - RKSU Legacy Integration

on:
  workflow_dispatch:
  push:
    branches:
      - KowSU

permissions:
  contents: read

concurrency:
  group: xen-rksu-legacy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Lvyana
      KBUILD_BUILD_HOST: Xen-Kernel
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: "%compiler% --version"

    steps:
      - name: Checkout Xen-Kernel KowSU branch
        uses: actions/checkout@v4
        with:
          ref: KowSU
          fetch-depth: 1
          lfs: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git curl libelf-dev libssl-dev make \
            python3 rsync device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libncurses-dev lz4 zip wget xz-utils file

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-xen-rksu-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-xen-rksu-

      - name: Prepare Clang r547379
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/clang/bin/clang" ] || [ ! -x "$HOME/clang/bin/ld.lld" ]; then
            rm -rf "$HOME/clang"
            git clone --depth=1 --single-branch --branch 15.0 \
              https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git "$HOME/clang"
            rm -rf "$HOME/clang/.git"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/ld.lld" --version

      - name: Remove vendor suffix from kernel version
        run: |
          set -euo pipefail
          sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION =/' Makefile
          test "$(make kernelversion)" = "4.14.357"

      - name: Guard hyp_core_ctl cpu_subsys include
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path("drivers/soc/qcom/hyp_core_ctl.c")
          hdr = Path("include/linux/cpu.h")
          text = src.read_text()
          if "cpu_subsys" in text and "cpu_subsys" not in hdr.read_text():
              raise SystemExit("cpu_subsys declaration missing from include/linux/cpu.h")
          if "cpu_subsys" in text and "#include <linux/cpu.h>" not in text:
              anchor = "#include <linux/init.h>"
              if anchor not in text:
                  raise SystemExit("No safe include anchor in hyp_core_ctl.c")
              src.write_text(text.replace(anchor, anchor + "\\n#include <linux/cpu.h>", 1))
          PY

      - name: Verify ZRAM default compressor
        run: |
          set -euo pipefail
          grep -Fq 'static const char *default_compressor = "lz4";' drivers/block/zram/zram_drv.c

      - name: Integrate RKSU Legacy v3.2.2-10
        run: |
          set -euo pipefail
          bash scripts/integrate-rksu-legacy.sh
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -qE '^obj-\$\(CONFIG_KSU\)[[:space:]]*\+= kernelsu/' drivers/Makefile
          # RKSU Legacy hook mode must be selected from the symbols actually
          # exported by the pinned legacy source, not inferred from Manager branding.
          echo "RKSU upstream hook choices are reported above; fail unless a non-GKI path exists."
          if grep -qE 'depends on KPROBES|depends on GKI|depends on CONFIG_KPROBES' drivers/kernelsu/Kconfig; then
            echo "::error::This RKSU Kconfig still gates the backend on KPROBES/GKI; implement a reviewed non-GKI manual-hook port first."
            exit 1
          fi
          git diff --check

      - name: Configure Xen + RKSU Legacy + ThinLTO
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          LLVM_VARS=(CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1)
          KMAKE=(make ARCH=arm64 O=out "${LLVM_VARS[@]}")
          "${KMAKE[@]}" vayu_defconfig

          # Enable root backend only after upstream legacy Kconfig is loaded.
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-Xen-RKSU+1" --disable LOCALVERSION_AUTO \
            --enable KSU \
            --enable LTO --enable LTO_CLANG --enable THINLTO --disable LTO_NONE \
            --enable CC_OPTIMIZE_FOR_PERFORMANCE --disable CC_OPTIMIZE_FOR_SIZE

          "${KMAKE[@]}" olddefconfig

          grep -q '^CONFIG_KSU=y$' out/.config || {
            echo "::error::CONFIG_KSU did not survive olddefconfig; inspect RKSU Kconfig prerequisites"
            exit 1
          }
          grep -q '^CONFIG_LTO=y$' out/.config
          grep -q '^CONFIG_LTO_CLANG=y$' out/.config
          grep -q '^CONFIG_THINLTO=y$' out/.config
          ! grep -q '^CONFIG_LTO_NONE=y$' out/.config
          cp out/.config xen-rksu.config
          "${KMAKE[@]}" kernelrelease

      - name: Build kernel Image
        run: |
          set -uo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64 SUBARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ \
            HOSTAR=llvm-ar HOSTLD=ld.lld LLVM=1 LLVM_IAS=1 CC="ccache clang" Image 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          test -s out/arch/arm64/boot/Image
          cat out/include/config/kernel.release

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp build.log artifacts/ 2>/dev/null || true
          cp xen-rksu.config artifacts/ 2>/dev/null || true
          cp out/.config artifacts/kernel.config 2>/dev/null || true
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/include/config/kernel.release artifacts/kernel-release.txt 2>/dev/null || true
          git rev-parse HEAD > artifacts/xen-commit.txt 2>/dev/null || true
          git -C KernelSU rev-parse HEAD > artifacts/rksu-commit.txt 2>/dev/null || true
          clang --version > artifacts/clang-version.txt 2>&1 || true

      - name: Upload RKSU build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-RKSU-Legacy
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
