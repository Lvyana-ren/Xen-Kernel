
name: Xen-Kernel-KSUN - Manual Hook Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Xen-Kernel source
        uses: actions/checkout@v4
        with:
          ref: "16-KSUN_Manual_hook"
          fetch-depth: 1
          lfs: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      - name: Integrate KernelSU-Next Legacy
        shell: bash
        run: |
          set -euo pipefail

          if [ -e KernelSU-Next ] || [ -e KernelSU ]; then
            echo "::error::KernelSU directory already exists."
            exit 1
          fi

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-next-setup.sh

          bash /tmp/ksu-next-setup.sh legacy

          test -d KernelSU-Next/kernel
          test -f drivers/kernelsu/Kconfig

          echo "===== KernelSU-Next commit ====="
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next describe --tags --always || true

      - name: Apply Manual Hook integration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"PATCH ERROR: {label}: expected one match, found {count}"
                  )
              return text.replace(old, new, 1)

          # ---------------------------------------------------------
          # fs/exec.c
          # Add the KSUN handler declaration and wire execve hooks.
          # ---------------------------------------------------------
          p = Path("fs/exec.c")
          text = p.read_text()

          if "ksu_handle_execveat" in text:
              raise SystemExit(
                  "PATCH ERROR: execveat handler already exists in fs/exec.c"
              )

          declaration_anchor = (
              "int do_execve(struct filename *filename,\n"
          )

          declaration = (
              "#if defined(CONFIG_KSU)\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_execveat(int *fd, "
              "struct filename **filename_ptr,\n"
              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
              "#endif\n"
          )

          text = replace_once(
              text,
              declaration_anchor,
              declaration + declaration_anchor,
              "execve handler declaration",
          )

          native_old = (
              "int do_execve(struct filename *filename,\n"
              "\tconst char __user *const __user *__argv,\n"
              "\tconst char __user *const __user *__envp)\n"
              "{\n"
              "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
              "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
              "}"
          )

          native_new = (
              "int do_execve(struct filename *filename,\n"
              "\tconst char __user *const __user *__argv,\n"
              "\tconst char __user *const __user *__envp)\n"
              "{\n"
              "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
              "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
              "#if defined(CONFIG_KSU)\n"
              "\tint fd = AT_FDCWD;\n"
              "\tint flags = 0;\n"
              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
              "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n"
              "#else\n"
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
              "#endif\n"
              "}"
          )

          text = replace_once(
              text, native_old, native_new, "native execve hook"
          )

          compat_pattern = re.compile(
              r"(static int compat_do_execve\(struct filename \*filename,"
              r".*?\n\})(?=\nstatic int compat_do_execveat)",
              re.S,
          )

          match = compat_pattern.search(text)
          if not match:
              raise SystemExit(
                  "PATCH ERROR: compat_do_execve function not found"
              )

          compat_func = match.group(1)
          compat_old = (
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);"
          )
          compat_new = (
              "#if defined(CONFIG_KSU)\n"
              "\tint fd = AT_FDCWD;\n"
              "\tint flags = 0;\n"
              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
              "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n"
              "#else\n"
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
              "#endif"
          )

          compat_func = replace_once(
              compat_func, compat_old, compat_new, "compat execve hook"
          )

          text = (
              text[:match.start()]
              + compat_func
              + text[match.end():]
          )
          p.write_text(text)

          # ---------------------------------------------------------
          # fs/open.c
          # Add the KSUN faccessat handler.
          # ---------------------------------------------------------
          p = Path("fs/open.c")
          text = p.read_text()

          if "ksu_handle_faccessat" in text:
              raise SystemExit(
                  "PATCH ERROR: faccessat handler already exists in fs/open.c"
              )

          open_anchor = "SYSCALL_DEFINE3(faccessat, int, dfd, "
          open_declaration = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_faccessat(int *dfd, "
              "const char __user **filename_user,\n"
              "\t\t\t\tint *mode, int *flags);\n"
              "#endif\n"
          )

          text = replace_once(
              text,
              open_anchor,
              open_declaration + open_anchor,
              "faccessat handler declaration",
          )

          faccess_anchor = (
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
              "\tif (mode & ~S_IRWXO)"
          )

          faccess_new = (
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
              "#ifdef CONFIG_KSU\n"
              "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
              "#endif\n"
              "\tif (mode & ~S_IRWXO)"
          )

          text = replace_once(
              text,
              faccess_anchor,
              faccess_new,
              "faccessat hook call",
          )

          p.write_text(text)

          print("Manual Hook patches applied successfully.")
          PY

          echo "===== Check whitespace ====="
          git diff --check

          echo "===== Verify handler locations ====="
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          # Set the requested kernel identity.
          sed -i \
            's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION = -openela-Xen-KSUN/' \
            Makefile

          make O=out vayu_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_KPROBES_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK

          make O=out olddefconfig

          echo "===== KSUN configuration ====="
          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK)=' \
            out/.config || true

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "::error::Manual Hook is not enabled by olddefconfig."
            exit 1
          fi

      - name: Download Clang toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang

          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Build Xen-Kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out

          set +e
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Kernel compilation failed."
            exit "$BUILD_STATUS"
          fi

          test -s out/arch/arm64/boot/Image

          echo "===== Kernel release ====="
          make -s O=out kernelrelease

      - name: Collect build artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          [ ! -f build.log ] || cp build.log artifacts/
          [ ! -f out/.config ] || cp out/.config artifacts/kernel.config

          [ ! -f out/arch/arm64/boot/Image ] || \
            cp out/arch/arm64/boot/Image artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz ] || \
            cp out/arch/arm64/boot/Image.gz artifacts/

          [ ! -f out/arch/arm64/boot/Image.gz-dtb ] || \
            cp out/arch/arm64/boot/Image.gz-dtb artifacts/

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f -name '*.dtb' \
              -exec cp --parents '{}' artifacts/ \; || true
          fi

          git rev-parse HEAD > artifacts/source-commit.txt

          git -C KernelSU-Next rev-parse HEAD \
            > artifacts/ksun-commit.txt 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-Manual-Hook
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
