
name: Xen-Kernel-KSUN - Legacy Kprobe Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout Xen-Kernel KSUN branch
      # ============================================================
      - name: Checkout Xen-Kernel-KSUN source
        uses: actions/checkout@v4
        with:
          ref: "16-KSUN"
          fetch-depth: 1
          lfs: true

      # ============================================================
      # 2. Integrate KernelSU Next Legacy
      # ============================================================
      - name: Integrate KernelSU Next Legacy
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Integrating KernelSU Next Legacy ==="

          if [ -e KernelSU-Next ] || [ -e KernelSU ]; then
            echo "::error::Existing KernelSU directory detected."
            exit 1
          fi

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-next-setup.sh

          bash /tmp/ksu-next-setup.sh legacy

          if [ ! -d KernelSU-Next/kernel ]; then
            echo "::error::KernelSU Next kernel directory missing."
            exit 1
          fi

          if [ ! -L drivers/kernelsu ]; then
            echo "::error::KernelSU Next legacy symlink missing."
            ls -la drivers/
            exit 1
          fi

          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::KernelSU Next Kconfig missing."
            exit 1
          fi

          echo "=== KernelSU Next source commit ==="
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next branch --show-current

          echo "=== KernelSU Kconfig symbols ==="
          grep -R -n -E \
            '^[[:space:]]*config (KSU|KSU_KPROBE_HOOKS|KPROBE_HOOKS)([[:space:]]|$)' \
            KernelSU-Next/kernel drivers/kernelsu \
            2>/dev/null || true

          echo "=== Legacy integration verified ==="
          ls -ld drivers/kernelsu

      # ============================================================
      # 3. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc bison build-essential ccache \
            clang flex git libelf-dev libssl-dev \
            lld llvm make python3 rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            libncurses-dev \
            lz4 zip wget xz-utils file

      # ============================================================
      # 4. Prepare the same Clang toolchain as the main branch
      # ============================================================
      - name: Prepare upstream Clang
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            --single-branch \
            --branch 15.0 \
            "https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git" \
            "$HOME/clang"

          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

          echo "=== Clang version ==="
          "$HOME/clang/bin/clang" --version

          echo "=== LLD version ==="
          "$HOME/clang/bin/ld.lld" --version

          echo "=== LLVM archiver ==="
          "$HOME/clang/bin/llvm-ar" --version

      # ============================================================
      # 5. Validate source and toolchains
      # ============================================================
      - name: Check source and toolchains
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Source commit ==="
          git log -1 --oneline

          echo "=== Kernel version ==="
          make kernelversion

          echo "=== Required source files ==="
          test -f Makefile
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/vayu_defconfig
          test -f scripts/config

          echo "=== GCC64 ==="
          aarch64-linux-gnu-gcc --version

          echo "=== GCC32 ==="
          arm-linux-gnueabi-gcc --version

          echo "=== LLVM tools ==="
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/ld.lld" --version
          "$HOME/clang/bin/llvm-ar" --version

      # ============================================================
      # 6. Configure KernelSU Next Legacy and diagnose Kprobe
      # ============================================================
      - name: Configure KernelSU Next Kprobe
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          echo "=== Generate vayu defconfig ==="
          make ARCH=arm64 O=out vayu_defconfig

          echo "=== Configure KernelSU Next ==="

          scripts/config --file out/.config --enable MODULES
          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable KPROBE_EVENTS
          scripts/config --file out/.config --enable PERF_EVENTS
          scripts/config --file out/.config --enable TRACING
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_KPROBE_HOOKS

          echo "=== Set Xen-Kernel version suffix ==="

          scripts/config --file out/.config \
            --set-str LOCALVERSION "-Xen-KSUN"

          scripts/config --file out/.config \
            --disable LOCALVERSION_AUTO

          echo "=== Resolve Kconfig dependencies ==="

          make ARCH=arm64 O=out olddefconfig

          echo "=== Final Kconfig values ==="

          grep -E \
            '^(CONFIG_(MODULES|KSU|KSU_KPROBE_HOOKS|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|PERF_EVENTS|TRACING|FTRACE|FUNCTION_TRACER|TRACEPOINTS|EVENT_TRACING|PROBE_EVENTS)=|# CONFIG_(MODULES|KSU|KSU_KPROBE_HOOKS|KPROBES|KPROBE_EVENTS|PERF_EVENTS|TRACING|FTRACE|FUNCTION_TRACER|TRACEPOINTS|EVENT_TRACING|PROBE_EVENTS) is not set)' \
            out/.config || true

          echo "=== Relevant Kconfig definitions ==="

          grep -n -B 20 -A 25 'config KPROBE_EVENTS' \
            kernel/trace/Kconfig || true

          grep -R -n -E \
            '^[[:space:]]*config (KSU|KSU_KPROBE_HOOKS|KPROBES|KPROBE_EVENTS|PROBE_EVENTS|HAVE_REGS_AND_STACK_ACCESS_API|PERF_EVENTS|TRACING|FTRACE|FUNCTION_TRACER|TRACEPOINTS|EVENT_TRACING)([[:space:]]|$)' \
            Kconfig arch/arm64 kernel KernelSU-Next/kernel \
            2>/dev/null || true

          echo "=== Kconfig symbol states ==="

          for option in \
            MODULES KSU KSU_KPROBE_HOOKS \
            KPROBES KPROBE_EVENTS \
            PERF_EVENTS TRACING FTRACE \
            FUNCTION_TRACER TRACEPOINTS EVENT_TRACING \
            HAVE_REGS_AND_STACK_ACCESS_API; do

            printf '%s: ' "$option"
            scripts/config --file out/.config --state "$option" || true
          done

          echo "=== Validate required options ==="

          failed=0

          for option in \
            MODULES KSU KSU_KPROBE_HOOKS \
            KPROBES KPROBE_EVENTS; do

            if ! grep -qx "CONFIG_${option}=y" out/.config; then
              echo "::error::CONFIG_${option} is not enabled after olddefconfig."
              failed=1
            else
              echo "CONFIG_${option}=y [OK]"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "=== Kprobe dependency diagnostics ==="

            grep -R -n -E \
              'config (KPROBE_EVENTS|PROBE_EVENTS|HAVE_REGS_AND_STACK_ACCESS_API|PERF_EVENTS|TRACING|FTRACE|FUNCTION_TRACER|TRACEPOINTS|EVENT_TRACING)' \
              Kconfig arch/arm64 kernel \
              2>/dev/null || true

            echo "::error::Required KSUN/Kprobe configuration is unavailable."
            exit 1
          fi

          echo "=== Save validated configuration ==="
          cp out/.config baseline.config

          echo "=== Kernel version ==="
          make kernelversion

          echo "=== Kernel release ==="
          make ARCH=arm64 O=out kernelrelease

          grep '^CONFIG_LOCALVERSION=' out/.config

      # ============================================================
      # 7. Compile Xen-Kernel KSUN
      # ============================================================
      - name: Compile kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Lvyana"
          export KBUILD_BUILD_HOST="Xen-Kernel"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            DTC_EXT=dtc \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            2>&1 | tee build.log

      # ============================================================
      # 8. Verify build output
      # ============================================================
      - name: Verify kernel image
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image not found or empty."
            exit 1
          fi

          echo "=== Kernel image ==="
          file "$IMAGE"
          ls -lh "$IMAGE"

          echo "=== Kernel release ==="
          make ARCH=arm64 O=out kernelrelease

          echo "=== Available build outputs ==="
          find out/arch/arm64/boot \
            -maxdepth 2 -type f \
            \( -name "Image*" -o -name "*.dtb" -o -name "dtbo.img" \) \
            -print

      # ============================================================
      # 9. Upload successful build artifacts
      # ============================================================
      - name: Upload Xen-Kernel-KSUN artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-legacy-kprobe
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dtb.img
            out/.config
            baseline.config
            build.log

      # ============================================================
      # 10. Upload diagnostics if the build fails
      # ============================================================
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-KSUN-diagnostics
          if-no-files-found: warn
          path: |
            build.log
            baseline.config
            out/.config