name: Xen-Kernel - OxygenOS Beta

on:
  workflow_dispatch:
  push:
    branches:
      - Oplus-KSUN

permissions:
  contents: read

concurrency:
  group: xen-oos-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: "%compiler% --version"
      KBUILD_BUILD_USER: Lvyana
      KBUILD_BUILD_HOST: Xen-Kernel

    steps:
      - name: Checkout Xen-Kernel source
        uses: actions/checkout@v4
        with:
          # Build the exact branch/ref selected in workflow_dispatch.
          ref: ${{ github.ref }}
          fetch-depth: 1
          lfs: true

      - name: Verify selected source revision
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Selected ref: ${GITHUB_REF}"
          echo "Expected SHA: ${GITHUB_SHA}"
          echo "Checked out:  ${ACTUAL_SHA}"
          if [[ "${ACTUAL_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checkout does not match the workflow dispatch revision."
            exit 1
          fi

      - name: Install pinned KernelSU Next + apply manual hooks and SUSFS bridge
        shell: bash
        run: |
          set -euo pipefail
          KSUN_REPO="https://github.com/Lvyana-ren/KernelSU-Next"
          KSUN_SHA="465490a26667ba4cf00b3be975a7e28e53978829"
          test ! -e KernelSU-Next
          git clone "$KSUN_REPO" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSUN_SHA"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_SHA"
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          python3 scripts/apply-ksun-manual-hooks.py
          python3 scripts/apply-ksun-susfs-compat.py "$PWD/KernelSU-Next"
          git diff --check
          echo "KSUN pinned SHA: $(git -C KernelSU-Next rev-parse HEAD)"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git curl \
            libelf-dev libssl-dev make python3 rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libncurses-dev lz4 zip wget xz-utils file

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-xen-default-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-xen-default-ccache-

      - name: Prepare baseline Clang r547379
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/clang/bin/clang" ] || [ ! -x "$HOME/clang/bin/ld.lld" ]; then
            rm -rf "$HOME/clang"
            git clone --depth=1 --single-branch --branch 15.0 \
              https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
              "$HOME/clang"
            rm -rf "$HOME/clang/.git"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/ld.lld" --version

      - name: Validate source and toolchains
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/vayu_defconfig
          test -f scripts/config
          test -f drivers/soc/qcom/hyp_core_ctl.c
          test -f drivers/block/zram/zram_drv.c
          echo "===== Source commit ====="
          git rev-parse HEAD
          git log -1 --oneline
          echo "===== Kernel version ====="
          make kernelversion
          echo "===== GCC64 ====="
          aarch64-linux-gnu-gcc --version
          echo "===== GCC32 ====="
          arm-linux-gnueabi-gcc --version
          echo "===== Clang ====="
          "$HOME/clang/bin/clang" --version

      # The cpu_subsys compile failure is addressed conservatively:
      # include the kernel header that declares cpu_subsys, only if needed.
      - name: Guard hyp_core_ctl cpu_subsys declaration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("drivers/soc/qcom/hyp_core_ctl.c")
          header = Path("include/linux/cpu.h")
          text = source.read_text()
          header_text = header.read_text()

          if "cpu_subsys" in text and "cpu_subsys" not in header_text:
              raise SystemExit(
                  "Expected cpu_subsys declaration was not found in include/linux/cpu.h; "
                  "stopping rather than applying an unsafe workaround."
              )

          if "cpu_subsys" in text and "#include <linux/cpu.h>" not in text:
              anchor = "#include <linux/init.h>"
              if anchor not in text:
                  raise SystemExit("Cannot safely locate include anchor in hyp_core_ctl.c")
              text = text.replace(anchor, anchor + "\n#include <linux/cpu.h>", 1)
              source.write_text(text)
              print("Added missing #include <linux/cpu.h> to hyp_core_ctl.c")
          else:
              print("cpu.h include already present or cpu_subsys is not used; no change needed.")
          PY
          grep -n 'cpu_subsys\|linux/cpu.h' drivers/soc/qcom/hyp_core_ctl.c
          git diff --check

      - name: Verify ZRAM default compressor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/block/zram/zram_drv.c")
          text = path.read_text()
          match = re.search(r'(?m)^\s*static const char \*default_compressor\s*=\s*"([^"]+)"\s*;', text)
          if not match:
              raise SystemExit("Cannot identify ZRAM default_compressor safely; refusing blind source replacement.")
          current = match.group(1)
          if current != "lz4":
              text = text[:match.start(1)] + "lz4" + text[match.end(1):]
              path.write_text(text)
              print(f"Changed ZRAM default compressor: {current} -> lz4")
          else:
              print("ZRAM default compressor is already LZ4.")
          PY
          grep -n 'default_compressor' drivers/block/zram/zram_drv.c
          git diff --check

      - name: Configure optimized OxygenOS vayu kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"

          LLVM_VARS=(
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf
            HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            LLVM=1 LLVM_IAS=1
          )
          KMAKE=(make ARCH=arm64 O=out "${LLVM_VARS[@]}")

          "${KMAKE[@]}" vayu_oxygenos_defconfig

          # Enable OPlus subsystem menu and selected vendor drivers
          scripts/config --file out/.config --enable OPLUS_FEATURES

          # Enable KernelSU Next manual hooks + SUSFS v2.3.0
          scripts/config --file out/.config --enable KSU --enable KSU_MANUAL_HOOK --enable KSU_SUSFS
          scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH --enable KSU_SUSFS_SUS_MOUNT --enable KSU_SUSFS_SUS_KSTAT
          scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT --enable KSU_SUSFS_SPOOF_UNAME --enable KSU_SUSFS_ENABLE_LOG
          scripts/config --file out/.config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --file out/.config --enable KSU_SUSFS_OPEN_REDIRECT --enable KSU_SUSFS_SUS_MAP --disable KSU_SUSFS_SUS_MEMFD


          scripts/config --file out/.config \
            --set-str LOCALVERSION "-Xen+3" \
            --disable LOCALVERSION_AUTO \
            --enable LTO \
            --enable LTO_CLANG \
            --enable THINLTO \
            --disable LTO_NONE \
            --enable CC_OPTIMIZE_FOR_PERFORMANCE \
            --disable CC_OPTIMIZE_FOR_SIZE 
            
          "${KMAKE[@]}" olddefconfig

          echo "===== KSUN / SUSFS final config ====="
          grep -E '^(CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS)' out/.config
          for item in CONFIG_KSU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_SUSFS=y; do
            grep -Fqx "$item" out/.config || { echo "::error::Missing $item"; exit 1; }
          done

          echo "===== OxygenOS Android/vendor ABI configuration audit ====="
          required_config=(
            CONFIG_ANDROID_BINDER_IPC=y
            CONFIG_ANDROID_BINDERFS=y
            'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"'
            CONFIG_CGROUPS=y
            CONFIG_CPUSETS=y
            CONFIG_CGROUP_CPUACCT=y
            CONFIG_BLK_CGROUP=y
            CONFIG_PROC_FS=y
            CONFIG_SYSFS=y
            CONFIG_SECURITY_SELINUX=y
            CONFIG_DEFAULT_SECURITY_SELINUX=y
            CONFIG_MACH_XIAOMI=y
            CONFIG_MACH_XIAOMI_SM8150=y
            CONFIG_MACH_XIAOMI_VAYU=y
            CONFIG_BUILD_ARM64_DT_OVERLAY=y
          )
          for item in "${required_config[@]}"; do
            if ! grep -Fqx "${item}" out/.config; then
              echo "::error::Required OxygenOS ABI config missing: ${item}"
              exit 1
            fi
          done
          echo "All baseline Android/vendor ABI requirements are present."

          echo "===== Effective LTO / optimization / governor configuration ====="
          grep -E '^(CONFIG_(LTO|LTO_CLANG|THINLTO|LTO_NONE|CC_OPTIMIZE_FOR_PERFORMANCE|CC_OPTIMIZE_FOR_SIZE|CPU_FREQ|CPU_FREQ_GOV_SCHEDUTIL|CPU_FREQ_DEFAULT_GOV))=|^# CONFIG_(LTO|LTO_CLANG|THINLTO|LTO_NONE|CC_OPTIMIZE_FOR_PERFORMANCE|CC_OPTIMIZE_FOR_SIZE|CPU_FREQ_GOV_SCHEDUTIL) is not set' out/.config || true

          if ! grep -q '^CONFIG_LTO=y$' out/.config ||
             ! grep -q '^CONFIG_LTO_CLANG=y$' out/.config ||
             ! grep -q '^CONFIG_THINLTO=y$' out/.config ||
             grep -q '^CONFIG_LTO_NONE=y$' out/.config; then
            echo "::error::LTO/ThinLTO did not survive olddefconfig."
            exit 1
          fi

          if ! grep -q '^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y$' out/.config ||
             grep -q '^CONFIG_CC_OPTIMIZE_FOR_SIZE=y$'; then
            echo "::error::-O2 performance optimization is not selected in final .config."
            exit 1
          fi

          
          cp out/.config xen-default.config
          echo "===== Kernel release ====="
          "${KMAKE[@]}" kernelrelease

      # Buang tag -openela dari versi kernel
      - name: Strip -openela from kernel version
        shell: bash
        run: |
          set -euo pipefail

          echo "Sebelum:"
          grep -n '^EXTRAVERSION' Makefile

          sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION =/' Makefile

          echo "Sesudah:"
          grep -n '^EXTRAVERSION' Makefile

          if make kernelversion | grep -q openela; then
            echo "::error::Tag openela masih ada."
            exit 1
          fi

          make kernelversion

      - name: Compile Xen-Kernel Image and vayu device trees
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          set +e
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            DTC_EXT=dtc \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            Image dtbs 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          ccache -s || true
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "===== First compiler/linker errors ====="
            grep -n -m 30 -E 'error:|undefined (symbol|reference)|ld.lld: error|Error [0-9]+$' build.log || true
            exit "$BUILD_STATUS"
          fi

          test -s out/arch/arm64/boot/dts/qcom/sm8150-xiaomi.dtb
          test -s out/arch/arm64/boot/dts/qcom/vayu-sm8150-overlay.dtbo
          IMAGE="out/arch/arm64/boot/Image"
          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image is missing or empty."
            exit 1
          fi
          echo "===== Kernel Image ====="
          file "$IMAGE"
          ls -lh "$IMAGE"
          echo "===== Kernel release ====="
          cat out/include/config/kernel.release

          echo "===== LTO config embedded in Image ====="
          if [ -x scripts/extract-ikconfig ]; then
            scripts/extract-ikconfig "$IMAGE" 2>/dev/null \
              | grep -E '^(CONFIG_(LTO|LTO_CLANG|THINLTO|LTO_NONE|CC_OPTIMIZE_FOR_PERFORMANCE|CC_OPTIMIZE_FOR_SIZE|CPU_FREQ_DEFAULT_GOV_SCHEDUTIL)=|# CONFIG_LTO_CLANG is not set)' \
              || echo "Embedded config not readable."
          fi
          echo "===== ThinLTO-related symbols ====="
          grep -c '\.llvm\.' out/System.map || true
          echo "===== ZRAM source default ====="
          grep -n 'default_compressor' drivers/block/zram/zram_drv.c

      - name: Collect diagnostics and artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          [[ ! -f build.log ]] || cp build.log artifacts/
          [[ ! -f xen-default.config ]] || cp xen-default.config artifacts/
          [[ ! -f out/.config ]] || cp out/.config artifacts/kernel.config
          [[ -s out/arch/arm64/boot/Image ]] || true
          if [[ -s out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi
          if [[ -s out/arch/arm64/boot/Image.gz ]]; then
            cp out/arch/arm64/boot/Image.gz artifacts/
          fi
          if [[ -s out/arch/arm64/boot/dtbo.img ]]; then
            cp out/arch/arm64/boot/dtbo.img artifacts/
          fi
          if [[ -s out/arch/arm64/boot/dtb.img ]]; then
            cp out/arch/arm64/boot/dtb.img artifacts/
          fi
          if [[ -s out/arch/arm64/boot/dts/qcom/sm8150-xiaomi.dtb ]]; then
            cp out/arch/arm64/boot/dts/qcom/sm8150-xiaomi.dtb artifacts/vayu-sm8150-base.dtb
          fi
          if [[ -s out/arch/arm64/boot/dts/qcom/vayu-sm8150-overlay.dtbo ]]; then
            cp out/arch/arm64/boot/dts/qcom/vayu-sm8150-overlay.dtbo artifacts/vayu-sm8150-overlay.dtbo
          fi
          if [[ -f out/include/config/kernel.release ]]; then
            cp out/include/config/kernel.release artifacts/kernel-release.txt
          fi
          {
            echo "# OxygenOS Android/vendor ABI config"
            grep -E '^(CONFIG_(ANDROID_BINDER_IPC|ANDROID_BINDERFS|ANDROID_BINDER_DEVICES|CGROUPS|CPUSETS|CGROUP_CPUACCT|BLK_CGROUP|PROC_FS|SYSFS|SECURITY_SELINUX|DEFAULT_SECURITY_SELINUX|MACH_XIAOMI|MACH_XIAOMI_SM8150|MACH_XIAOMI_VAYU|BUILD_ARM64_DT_OVERLAY))=' out/.config || true
          } > artifacts/oxygenos-abi-config.txt
          git rev-parse HEAD > artifacts/source-commit.txt 2>/dev/null || true
          clang --version > artifacts/clang-version.txt 2>&1 || true
          ccache -s > artifacts/ccache-stats.txt 2>&1 || true
          git diff -- drivers/soc/qcom/hyp_core_ctl.c drivers/block/zram/zram_drv.c > artifacts/workflow-source-patches.diff 2>/dev/null || true
          find artifacts -type f -exec ls -lh '{}' \;

      - name: Upload Xen-Kernel Default artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xen-Kernel-OxygenOS-Beta
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
